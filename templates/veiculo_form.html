{% extends "base.html" %}{% block title %}{{ 'Editar' if veiculo else 'Novo' }} veículo - NousCard{% endblock %}{% block content %}
<div style="max-width:850px;margin:0 auto"><h1>🚗 {{ 'Editar' if veiculo else 'Novo' }} veículo</h1><form method="post" class="card" style="padding:1.2rem"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
<label style="grid-column:1/-1">Cliente *<select name="cliente_id" required style="width:100%"><option value="">Selecione...</option>{% for c in clientes %}<option value="{{ c.id }}" {% if (veiculo and veiculo.cliente_id==c.id) or (not veiculo and cliente_pre==c.id) %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></label>
<label>Placa *<input name="placa" required value="{{ veiculo.placa if veiculo else '' }}"></label><label>Modelo *<input name="modelo" required value="{{ veiculo.modelo if veiculo else '' }}"></label><label>Marca<input name="marca" value="{{ veiculo.marca or '' if veiculo else '' }}"></label><label>Ano<input name="ano" value="{{ veiculo.ano or '' if veiculo else '' }}"></label><label>Cor<input name="cor" value="{{ veiculo.cor or '' if veiculo else '' }}"></label><label>Quilometragem<input type="number" name="quilometragem" value="{{ veiculo.quilometragem or '' if veiculo else '' }}"></label><label>Chassi<input name="chassi" value="{{ veiculo.chassi or '' if veiculo else '' }}"></label><label>Seguradora<input name="seguradora" value="{{ veiculo.seguradora or '' if veiculo else '' }}"></label><label style="grid-column:1/-1">Observações<textarea name="observacoes" rows="4" style="width:100%">{{ veiculo.observacoes or '' if veiculo else '' }}</textarea></label></div><div style="margin-top:1rem"><button class="btn btn-primary">💾 Salvar</button> <a class="btn" href="{{ url_for('veiculos.listar') }}">Voltar</a></div></form></div>
{% endblock %}
